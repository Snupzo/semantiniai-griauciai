name: Website checks

on:
  pull_request:
    branches: [main]

jobs:
  html-check:
    name: HTML check
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Check that HTML tag exists
        run: |
          for file in index.html about.html contact.html; do
            grep -qi "<html" "$file"
          done

      - name: Check that H1 exists
        run: |
          for file in index.html about.html contact.html; do
            grep -qi "<h1" "$file"
          done
      - name: Check essential HTML tags and CSS link
        run: |
          for file in index.html about.html contact.html; do
            grep -qi "<!DOCTYPE html>" "$file"
            grep -qi "<title>" "$file"
            grep -qi 'href="style/"' "$file"
          done


  css-check:
    name: CSS check
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Check that style.css exists and is not empty
        run: test -s css/style.css
