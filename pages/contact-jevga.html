<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myteam — Contact</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Livvic:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="hero heroContact">
      <div class="container">
        <nav class="navbar" aria-label="Main navigation">
          <a href="index.html" class="logo">
            <img src="assets/img/contact/myteam_2.svg" alt="myteam" />
          </a>
          <ul class="navLinks">
            <li><a href="index.html">home</a></li>
            <li><a href="about.html">about</a></li>
          </ul>
          <a href="contact.html" class="btnOutline" aria-current="page">contact us</a>
        </nav>

        <div class="contactGrid">
          <div class="contactInfo">
            <h1 class="heroTitle contactTitle">Contact</h1>
            <p class="contactSubtitle">Ask us about</p>

            <ul class="contactTopics">
              <li class="contactTopicItem">
                <img
                  src="assets/img/contact/Group_11.svg"
                  alt=""
                  aria-hidden="true"
                  class="contactTopicIcon"
                />
                <span>The quality of our talent network</span>
              </li>
              <li class="contactTopicItem">
                <img
                  src="assets/img/contact/Group_12.svg"
                  alt=""
                  aria-hidden="true"
                  class="contactTopicIcon"
                />
                <span>Usage &amp; implementation of our software</span>
              </li>
              <li class="contactTopicItem">
                <img
                  src="assets/img/contact/Group_13.svg"
                  alt=""
                  aria-hidden="true"
                  class="contactTopicIcon"
                />
                <span>How we help drive innovation</span>
              </li>
            </ul>
          </div>

          <form class="contactForm" action="#" method="post" novalidate>
            <div class="formGroup">
              <label for="contactName" class="visuallyHidden">Name</label>
              <input
                type="text"
                id="contactName"
                name="name"
                placeholder="Name"
                required
              />
              <span class="formError" aria-live="polite"></span>
            </div>

            <div class="formGroup">
              <label for="contactEmail" class="visuallyHidden">Email Address</label>
              <input
                type="email"
                id="contactEmail"
                name="email"
                placeholder="Email Address"
                required
              />
              <span class="formError" aria-live="polite"></span>
            </div>

            <div class="formGroup">
              <label for="contactCompany" class="visuallyHidden">Company Name</label>
              <input
                type="text"
                id="contactCompany"
                name="company"
                placeholder="Company Name"
                required
              />
              <span class="formError" aria-live="polite"></span>
            </div>

            <div class="formGroup">
              <label for="contactTitle" class="visuallyHidden">Title</label>
              <input
                type="text"
                id="contactTitle"
                name="title"
                placeholder="Title"
                required
              />
              <span class="formError" aria-live="polite"></span>
            </div>

            <div class="formGroup">
              <label for="contactMessage" class="visuallyHidden">Message</label>
              <textarea
                id="contactMessage"
                name="message"
                rows="3"
                placeholder="Message"
                required
              ></textarea>
              <span class="formError" aria-live="polite"></span>
            </div>

            <button type="submit" class="btnSubmit">submit</button>
          </form>
        </div>
      </div>

      <img
        src="assets/img/contact/Group_8.svg"
        alt=""
        aria-hidden="true"
        class="patternContactLeft"
      />
      <img
        src="assets/img/contact/Group_7.svg"
        alt=""
        aria-hidden="true"
        class="patternContactRight"
      />
    </header>

    <footer class="footer">
      <div class="container footerGrid">
        <div class="footerBrand">
          <a href="index.html" class="logo">
            <img src="assets/img/contact/myteam_2.svg" alt="myteam" />
          </a>
          <ul class="navLinks">
            <li><a href="index.html">home</a></li>
            <li><a href="about.html">about</a></li>
          </ul>
        </div>

        <address class="footerAddress">
          987 Hillcrest Lane<br />
          Irvine, CA<br />
          California 92714<br />
          Call Us : <a href="tel:949-833-7432">949-833-7432</a>
        </address>

        <div class="footerMeta">
          <ul class="footerSocials" aria-label="Social media">
            <li>
              <a href="#" aria-label="myteam on Facebook">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path
                    d="M22.675 0H1.325C.593 0 0 .593 0 1.325v21.351C0 23.407.593 24 1.325 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.73 0 1.323-.593 1.323-1.325V1.325C24 .593 23.407 0 22.675 0z"
                  />
                </svg>
              </a>
            </li>
            <li>
              <a href="#" aria-label="myteam on Pinterest">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path
                    d="M12 0C5.373 0 0 5.372 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738a.36.36 0 01.083.345l-.333 1.36c-.053.22-.174.267-.402.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.631-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24 12 24c6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z"
                  />
                </svg>
              </a>
            </li>
            <li>
              <a href="#" aria-label="myteam on Twitter">
                <svg viewBox="0 0 24 20" fill="currentColor" aria-hidden="true">
                  <path
                    d="M24 2.557a9.83 9.83 0 01-2.828.775A4.932 4.932 0 0023.337.608a9.864 9.864 0 01-3.127 1.195A4.916 4.916 0 0016.616.248c-3.179 0-5.515 2.966-4.797 6.045A13.978 13.978 0 011.671 1.149a4.93 4.93 0 001.523 6.574 4.903 4.903 0 01-2.229-.616c-.054 2.281 1.581 4.415 3.949 4.89a4.935 4.935 0 01-2.224.084 4.918 4.918 0 004.588 3.417A9.867 9.867 0 010 17.54a13.94 13.94 0 007.548 2.212c9.142 0 14.307-7.721 13.995-14.646A10.025 10.025 0 0024 2.557z"
                  />
                </svg>
              </a>
            </li>
          </ul>
          <p class="footerCopyright">Copyright 2020. All Rights Reserved</p>
        </div>
      </div>
    </footer>

    <script>
      const contactForm = document.querySelector(".contactForm");
      if (contactForm) {
        contactForm.addEventListener("submit", (event) => {
          event.preventDefault();
          let isValid = true;

          contactForm.querySelectorAll(".formGroup").forEach((group) => {
            const field = group.querySelector("input, textarea");
            const error = group.querySelector(".formError");
            const value = field.value.trim();

            if (!value) {
              group.classList.add("hasError");
              error.textContent = "This field is required";
              isValid = false;
            } else if (
              field.type === "email" &&
              !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)
            ) {
              group.classList.add("hasError");
              error.textContent = "Please use a valid email address";
              isValid = false;
            } else {
              group.classList.remove("hasError");
              error.textContent = "";
            }
          });

          if (isValid) {
            contactForm.reset();
          }
        });

        contactForm.querySelectorAll("input, textarea").forEach((field) => {
          field.addEventListener("input", () => {
            const group = field.closest(".formGroup");
            group.classList.remove("hasError");
            group.querySelector(".formError").textContent = "";
          });
        });
      }
    </script>
  </body>
</html>
